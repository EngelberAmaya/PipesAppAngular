<section class="mx-10 mb-5">
  <h1 class="text-2xl font-bold">Pipes no tan comunes</h1>
  <p class="text-xl font-thin">Pipes incluídos en Angular</p>
</section>

<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
  <app-card title="i18nSelect Pipe">
    <p>Saludos {{ client().name }}, es un placer {{ client().gender | i18nSelect: invitationMap }} a nuestro evento.</p>
    <button class="btn btn-primary" (click)="changeClient()">
      Cambiar cliente
    </button>
  </app-card>
</div>
