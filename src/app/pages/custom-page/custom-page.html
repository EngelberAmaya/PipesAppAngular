<section class="mx-10">
  <h1 class="text-2xl font-bold">Pipes personalizados</h1>
  <p class="text-xl font-thin">Pipes no incluídos en Angular</p>
</section>

<div class="stats shadow">
  <div class="stat">
    <div class="stat-title">Toggle Case Pipe</div>
    <div class="stat-value">{{ name() | toggleCase: upperCase() }}</div>
    <div class="stat-desc">{{ name() }}</div>

    <button class="btn btn-primary" (click)="upperCase.set(!upperCase())">
      Toggle Case
    </button>
  </div>
</div>
